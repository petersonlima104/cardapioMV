<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cardápio Digital</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f9;
        font-family: "Segoe UI", sans-serif;
      }

      .header {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        color: white;
        padding: 30px 20px;
        text-align: center;
        border-radius: 0 0 25px 25px;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
      }

      .header p {
        font-size: 1rem;
        opacity: 0.9;
      }

      .menu-section {
        margin-bottom: 40px;
      }

      .menu-title {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 15px;
        text-align: center;
      }

      .menu-card {
        background: white;
        border-radius: 15px;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 15px;
      }

      .drink-name {
        font-size: 1.1rem;
        font-weight: 500;
      }

      .drink-price {
        font-size: 1.2rem;
        font-weight: bold;
        color: #dd2476;
      }

      .footer {
        text-align: center;
        font-size: 0.9rem;
        color: #666;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <!-- Cabeçalho -->
    <div class="header">
      <h1>🍹 Nosso Cardápio</h1>
      <p>Escolha sua bebida favorita</p>
    </div>

    <div class="container">
      <!-- Seção Bebidas -->
      <div class="menu-section">
        <div class="menu-title">🥤 Bebidas</div>

        <div class="menu-card">
          <div class="drink-name">Cerveja</div>
          <div class="drink-price">R$ 8,00</div>
        </div>

        <div class="menu-card">
          <div class="drink-name">Refrigerante</div>
          <div class="drink-price">R$ 6,00</div>
        </div>

        <div class="menu-card">
          <div class="drink-name">Água</div>
          <div class="drink-price">R$ 4,00</div>
        </div>

        <div class="menu-card">
          <div class="drink-name">Suco Natural</div>
          <div class="drink-price">R$ 10,00</div>
        </div>
      </div>

      <!-- Seção Drinks -->
      <div class="menu-section">
        <div class="menu-title">🍸 Drinks</div>

        <div class="menu-card">
          <div class="drink-name">Caipirinha</div>
          <div class="drink-price">R$ 15,00</div>
        </div>

        <div class="menu-card">
          <div class="drink-name">Mojito</div>
          <div class="drink-price">R$ 18,00</div>
        </div>

        <div class="menu-card">
          <div class="drink-name">Drink Especial da Casa</div>
          <div class="drink-price">R$ 22,00</div>
        </div>
      </div>
    </div>

    <!-- Rodapé -->
    <div class="footer">
      📲 Aponte a câmera para o QR Code e acesse nosso cardápio
    </div>
  </body>
</html>
